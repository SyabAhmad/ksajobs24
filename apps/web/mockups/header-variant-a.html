<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Header — Variant A: Refined Translucent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#effef5", 100: "#d9fbe7", 200: "#b5f6d0", 300: "#7cecb0",
                400: "#3cd989", 500: "#12bf6c", 600: "#079d55", 700: "#007a45",
                800: "#056138", 900: "#055030", 950: "#012d1a",
              },
              gold: { 300: "#fcd34d", 400: "#fbbf24", 500: "#f59e0b", 600: "#d97706" },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: "Plus Jakarta Sans", sans-serif; }
      .sample-bg {
        background:
          radial-gradient(1200px 500px at 80% -10%, #eafff3 0%, transparent 60%),
          radial-gradient(900px 400px at -10% 110%, #fff7e6 0%, transparent 55%),
          #f8fafc;
      }
    </style>
  </head>
  <body class="sample-bg min-h-screen text-slate-800">
    <div class="mx-auto max-w-5xl px-4 pb-20 pt-6">
      <p class="mb-2 text-center text-xs font-semibold uppercase tracking-[0.2em] text-brand-700">
        Variant A
      </p>
      <h1 class="mb-1 text-center text-2xl font-extrabold text-slate-900">
        Refined Translucent
      </h1>
      <p class="mb-8 text-center text-sm text-slate-500">
        Current style, polished: slimmer info bar, gradient rule, animated active underline, airy hover.
      </p>

      <!-- ===== HEADER MOCKUP (desktop) ===== -->
      <header class="sticky top-0 z-50 rounded-2xl overflow-hidden shadow-sm ring-1 ring-slate-100">
        <!-- Top info bar -->
        <div class="hidden bg-brand-950 text-brand-100 md:block">
          <div class="mx-auto flex h-8 max-w-7xl items-center justify-between px-4 text-[11px] font-medium sm:px-6">
            <div class="flex items-center gap-4">
              <span class="inline-flex items-center gap-1.5">
                <svg class="size-3 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                Riyadh, Saudi Arabia
              </span>
              <a href="mailto:info@ksajobs24.com" class="inline-flex items-center gap-1.5 transition-colors hover:text-white">
                <svg class="size-3 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                info@ksajobs24.com
              </a>
              <span class="inline-flex items-center gap-1.5">
                <svg class="size-3 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                Jobs updated daily
              </span>
            </div>
            <div class="flex items-center gap-4">
              <span class="inline-flex items-center gap-1.5">
                <svg class="size-3 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
                100% free — apply without sign-up
              </span>
              <span class="h-3 w-px bg-brand-100/25" aria-hidden />
              <div class="inline-flex items-center gap-1.5">
                <svg class="size-3 text-gold-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
                <button class="font-semibold text-white">EN</button>
                <span class="text-brand-100/40">|</span>
                <button class="transition-colors hover:text-white">العربية</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Main bar -->
        <div class="relative border-b border-transparent bg-white/80 backdrop-blur-xl">
          <!-- gradient rule -->
          <div class="pointer-events-none absolute inset-x-0 bottom-0 h-px bg-gradient-to-r from-gold-400/0 via-brand-500 to-gold-400/0"></div>
          <div class="mx-auto flex h-20 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
            <img src="../../public/logo.png" alt="KSA Jobs 24" class="h-11 w-auto" />

            <nav class="hidden items-center gap-1 md:flex" aria-label="Primary">
              <a href="#" class="relative rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-700">All Jobs</a>
              <a href="#" class="relative rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-700">Engineering</a>
              <a href="#" class="relative rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-700">IT</a>
              <a href="#" class="relative rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-700">Safety</a>

              <div class="relative" x-data="{open:false}" @mouseenter="open=true" @mouseleave="open=false">
                <button class="flex items-center gap-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-brand-50 hover:text-brand-700">
                  Categories
                  <svg class="size-4 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </button>
              </div>
            </nav>

            <div class="flex items-center gap-2">
              <form class="hidden items-center rounded-full border border-brand-200/70 bg-brand-50/50 transition-all md:flex" role="search">
                <button type="button" class="grid size-10 place-items-center rounded-full text-slate-500 transition-colors hover:bg-brand-50 hover:text-brand-700" aria-label="Search">
                  <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <input placeholder="Job title, keyword…" class="w-48 bg-transparent pr-4 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none" />
              </form>
              <button class="grid size-10 place-items-center rounded-xl text-slate-700 transition-colors hover:bg-brand-50 md:hidden" aria-label="Open menu">
                <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ===== MOBILE MOCKUP ===== -->
      <p class="mb-3 mt-12 text-center text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">Mobile view</p>
      <div class="mx-auto max-w-sm">
        <header class="overflow-hidden rounded-2xl ring-1 ring-slate-100 shadow-sm">
          <div class="border-b border-slate-100 bg-white/90 backdrop-blur-xl">
            <div class="relative flex h-16 items-center justify-between px-4">
              <img src="../../public/logo.png" alt="KSA Jobs 24" class="h-10 w-auto" />
              <form class="flex overflow-hidden rounded-xl border border-brand-200 bg-brand-50/60" role="search">
                <input placeholder="Search…" class="w-full bg-transparent px-3 py-2 text-sm focus:outline-none" />
                <button class="grid shrink-0 place-items-center bg-brand-600 px-3 text-white" aria-label="Search">
                  <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
              </form>
              <button class="grid size-10 place-items-center rounded-xl text-slate-700 transition-colors hover:bg-brand-50" aria-label="Open menu">
                <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
            </div>
          </div>
        </header>
      </div>
    </div>
  </body>
</html>
